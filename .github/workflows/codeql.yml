name: "CodeQL"

on:
  push:
    branches: [ "wizards" ]
  pull_request:
    branches: [ "wizards" ]
  schedule:
    - cron: '15 14 * * 3'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        build-mode: manual
        queries: security-extended

    - name: Build
      run: |
        dotnet restore Lidgren.Network/Lidgren.Network.csproj
        dotnet build Lidgren.Network/Lidgren.Network.csproj --no-restore -f net8.0 -p:UseSharedCompilation=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:csharp"
